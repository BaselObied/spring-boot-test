spring:
  application:
    name: quiz-arena
  profiles:
    active: stub

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true

  cache:
    type: redis

  data:
    redis:
      host: localhost
      port: 6379

quizarena:
  trivia-api:
    base-url: https://opentdb.com/api.php
